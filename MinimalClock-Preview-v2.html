<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Minimal Clock</title>
<style>
:root{--bg:#000;--fg:#fff;--clock-size:24vw;--weight:300}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;transition:background .16s,color .16s}
#clock{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:pan-y}
#mainTime{font-size:var(--clock-size);font-weight:var(--weight);letter-spacing:.005em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
#cornerTime{position:absolute;font-size:clamp(18px,3vw,38px);font-weight:500;font-variant-numeric:tabular-nums}
#cornerTime.hidden{display:none}
#cornerTime.top-left{top:4vh;left:4vw}
#cornerTime.top-right{top:4vh;right:4vw}
#cornerTime.bottom-left{bottom:4vh;left:4vw}
#cornerTime.bottom-right{bottom:4vh;right:4vw}
#panel{position:fixed;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:#0009;padding:16px}
#panel.open{display:flex}
.card{width:min(460px,100%);max-height:92vh;overflow:auto;background:#202020;color:#fff;border:1px solid #555;border-radius:16px;padding:22px;box-shadow:0 16px 60px #0008}
.card h2{margin:0 0 18px;font-size:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:17px 0}
label{font-size:14px}
select,input[type=range]{width:55%;accent-color:#bbb}
select,button{background:#333;color:white;border:1px solid #666;border-radius:8px;padding:9px}
.buttons{display:flex;justify-content:flex-end;margin-top:22px}
.note{font-size:12px;line-height:1.5;opacity:.7}
@media(orientation:landscape){#cornerTime{font-size:clamp(16px,2.4vw,30px)}}
</style>
</head>
<body>
<div id="clock"><div id="mainTime">00:00:00</div><div id="cornerTime" class="hidden bottom-right">00:00</div></div>
<div id="panel"><div class="card">
<h2>Minimal Clock settings</h2>
<div class="row"><label for="mode">Clock mode</label><select id="mode"><option value="0">Hours : minutes : seconds</option><option value="1">Minutes : seconds</option><option value="2">Large seconds + small time</option></select></div>
<div class="row"><label for="size">Number size</label><input id="size" type="range" min="12" max="85" value="24"></div>
<div class="row"><label for="weight">Number thickness</label><input id="weight" type="range" min="100" max="900" step="100" value="300"></div>
<div class="row"><label for="corner">Small time corner</label><select id="corner"><option value="top-left">Top left</option><option value="top-right">Top right</option><option value="bottom-left">Bottom left</option><option value="bottom-right" selected>Bottom right</option></select></div>
<div class="row"><label for="theme">Appearance</label><select id="theme"><option value="dark">Black background / white digits</option><option value="light">White background / black digits</option></select></div>
<div class="row"><label for="sound">Mechanical tick</label><input id="sound" type="checkbox" checked></div>
<div class="row"><label for="volume">Tick volume</label><input id="volume" type="range" min="0" max="100" value="45"></div>
<p class="note">The preview makes one short, sharp watch-like tick per second in the large-seconds mode. Browser audio may begin after your first interaction.</p>
<div class="buttons"><button id="close">Close</button></div>
</div></div>
<script>
(()=>{
const main=document.getElementById('mainTime'),corner=document.getElementById('cornerTime'),panel=document.getElementById('panel');
const modeSel=document.getElementById('mode'),size=document.getElementById('size'),weight=document.getElementById('weight'),cornerSel=document.getElementById('corner'),themeSel=document.getElementById('theme'),soundSel=document.getElementById('sound'),volume=document.getElementById('volume');
let mode=0,dark=true,lastSecond=-1,holdTimer=null,startX=0,startY=0,moved=false,holdTriggered=false,audioCtx=null;
const pad=n=>String(n).padStart(2,'0');
function timeParts(){const d=new Date();return{h:pad(d.getHours()),m:pad(d.getMinutes()),s:pad(d.getSeconds())};}
function fitSize(){
 const vw=window.innerWidth, vh=window.innerHeight;
 const desired=Number(size.value)/100*Math.min(vw,vh)*1.75;
 const text=main.textContent||'00:00:00';
 const widthFactor=mode===0?4.9:mode===1?3.0:1.5;
 const maxByWidth=vw*.90/(widthFactor*.62);
 const maxByHeight=vh*.72;
 document.documentElement.style.setProperty('--clock-size',Math.max(12,Math.min(desired,maxByWidth,maxByHeight))+'px');
 document.documentElement.style.setProperty('--weight',weight.value);
}
function render(){
 const t=timeParts();
 main.textContent=mode===0?`${t.h}:${t.m}:${t.s}`:mode===1?`${t.m}:${t.s}`:t.s;
 corner.textContent=`${t.h}:${t.m}`;
 corner.className=mode===2?cornerSel.value:'hidden';
 fitSize();
 if(mode===2&&soundSel.checked&&Number(t.s)!==lastSecond)playTick();
 lastSecond=Number(t.s);
}
function setMode(v){mode=(v+3)%3;modeSel.value=mode;lastSecond=-1;render();}
function setTheme(){dark=themeSel.value==='dark';document.documentElement.style.setProperty('--bg',dark?'#000':'#fff');document.documentElement.style.setProperty('--fg',dark?'#fff':'#000');}
function openSettings(){panel.classList.add('open');}
function closeSettings(){panel.classList.remove('open');}
function playTick(){
 if(!soundSel.checked||Number(volume.value)===0)return;
 try{
  audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime,level=Number(volume.value)/100;
  // A single, very brief broadband impulse with a restrained high-frequency resonant body.
  const duration=.012,frames=Math.max(1,Math.floor(audioCtx.sampleRate*duration));
  const buffer=audioCtx.createBuffer(1,frames,audioCtx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<frames;i++){const envelope=Math.pow(1-i/frames,3);data[i]=(Math.random()*2-1)*envelope;}
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  filter.type='highpass';filter.frequency.value=1800;filter.Q.value=.7;
  gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.8*level,now+.001);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start(now);src.stop(now+duration);
 }catch(e){}
}
modeSel.addEventListener('change',()=>setMode(Number(modeSel.value)));
[size,weight].forEach(el=>el.addEventListener('input',fitSize));
cornerSel.addEventListener('change',render);themeSel.addEventListener('change',setTheme);
document.getElementById('close').addEventListener('click',closeSettings);
panel.addEventListener('click',e=>{if(e.target===panel)closeSettings();});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeSettings();
 if(panel.classList.contains('open'))return;
 if(e.key==='ArrowRight')setMode(mode+1);
 if(e.key==='ArrowLeft')setMode(mode-1);
 if(e.code==='Space'){e.preventDefault();themeSel.value=dark?'light':'dark';setTheme();}
 if(e.key.toLowerCase()==='s')openSettings();
});
const clock=document.getElementById('clock');
clock.addEventListener('pointerdown',e=>{
 startX=e.clientX;startY=e.clientY;moved=false;holdTriggered=false;
 holdTimer=setTimeout(()=>{if(!moved){holdTriggered=true;openSettings();}},650);
});
clock.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)moved=true;});
clock.addEventListener('pointerup',e=>{
 clearTimeout(holdTimer);
 if(holdTriggered)return;
 if(moved){const dx=e.clientX-startX;if(Math.abs(dx)>35)setMode(mode+(dx<0?1:-1));}
 else{themeSel.value=dark?'light':'dark';setTheme();}
});
clock.addEventListener('pointercancel',()=>clearTimeout(holdTimer));
window.addEventListener('resize',fitSize);
setTheme();render();setInterval(render,100);
})();
</script>
</body></html>
